</style></head><body><div class="app"><header class="top"><div class="logo">APP</div><div><div class="brand">APP<span style="color:#bfff72">.</span></div><div class="subtitle">A Ponerse Polenta</div><div class="tagline">tu gym, a tu ritmo</div></div><span class="pill">VERSIÓN PILOTO</span></header><div class="account-banner" id="cloudStatus" role="status">Modo sin cuenta · tus datos siguen en este dispositivo</div><div class="account-actions"><button class="btn small" id="accountButton" type="button">Cuenta y sincronización</button></div><main id="view"></main><aside id="installHelp" class="install-tip" hidden></aside></div><nav class="nav"><div class="nav-inner"><button data-nav="hoy">⚡<br>Entrenar</button><button data-nav="maquinas">🏋️<br>Máquinas</button><button data-nav="planes">📋<br>Planes</button><button data-nav="historial">📈<br>Historial</button></div></nav><div id="toast" class="toast"></div><dialog id="dlg"><div id="dialogContent"></div></dialog><script>
'use strict';
const KEY='app-polenta-v1';const defaults=[['Prensa de piernas','Piernas','🦵','Leg press'],['Extensión de cuádriceps','Piernas','🦵','Extensora'],['Curl femoral','Piernas','🦿','Femoral sentado o acostado'],['Polea al pecho','Espalda','🏋️','Jalón al pecho, lat pulldown'],['Remo sentado','Espalda','🚣','Remo en polea'],['Press de pecho','Pecho','💪','Chest press'],['Pec deck','Pecho','🦋','Mariposa, aperturas'],['Press de hombros','Hombros','🏋️','Shoulder press'],['Abductores','Piernas','🦵','Máquina de abductores'],['Aductores','Piernas','🦵','Máquina de aductores'],['Polea de tríceps','Brazos','💪','Extensión tríceps'],['Curl de bíceps','Brazos','💪','Bíceps en máquina']];
const extraCatalog=[["Prensa horizontal","Piernas","🦵","Prensa sentada, horizontal leg press"],["Prensa inclinada a 45°","Piernas","🦵","Leg press 45, prensa 45 grados"],["Sentadilla hack","Piernas","🦵","Hack squat, hack"],["Sentadilla péndulo","Piernas","🦵","Pendulum squat"],["Sentadilla con cinturón","Piernas","🦵","Belt squat"],["Máquina Smith","Piernas","🏋️","Multipower, máquina guiada, sentadilla Smith"],["Curl femoral sentado","Piernas","🦿","Leg curl seated, isquiotibiales sentado"],["Curl femoral acostado","Piernas","🦿","Leg curl lying, femoral tumbado"],["Hip thrust","Piernas","🍑","Empuje de cadera, glute drive, glúteos"],["Patada de glúteos","Piernas","🍑","Glute kickback, extensión de cadera"],["Elevación de gemelos sentado","Piernas","🦵","Pantorrillas sentado, seated calf raise"],["Elevación de gemelos de pie","Piernas","🦵","Pantorrillas de pie, standing calf raise"],["Press de pecho inclinado","Pecho","💪","Incline chest press, press inclinado"],["Press de pecho declinado","Pecho","💪","Decline chest press, press declinado"],["Press de pecho convergente","Pecho","💪","Chest press convergente, iso-lateral"],["Cruce de poleas","Pecho","🦋","Cable crossover, aperturas en poleas"],["Fondos asistidos","Pecho","💪","Dips asistidos, assisted dips"],["Remo alto en máquina","Espalda","🚣","High row, remo alto"],["Remo en T","Espalda","🚣","T-bar row, remo en punta"],["Remo unilateral en máquina","Espalda","🚣","Iso lateral row, remo a una mano"],["Dominadas asistidas","Espalda","🏋️","Assisted pull-up, pullups asistidas"],["Pullover en máquina","Espalda","🏋️","Machine pullover"],["Jalón con agarre neutro","Espalda","🏋️","Neutral grip pulldown, dorsal"],["Elevaciones laterales en máquina","Hombros","💪","Lateral raise, deltoides medio"],["Pájaros en máquina","Hombros","🦋","Reverse pec deck, deltoide posterior"],["Press de hombros iso-lateral","Hombros","🏋️","Iso lateral shoulder press"],["Curl de bíceps predicador","Brazos","💪","Preacher curl, banco Scott, curl Scott"],["Curl de bíceps en polea","Brazos","💪","Cable curl, bíceps polea baja"],["Extensión de tríceps en máquina","Brazos","💪","Seated triceps extension, tríceps sentado"],["Fondos para tríceps en máquina","Brazos","💪","Triceps dip machine, press de tríceps"],["Abdominales en máquina","Abdomen","🎯","Crunch machine, abdominal crunch"],["Rotación de torso","Abdomen","🎯","Rotary torso, oblicuos"],["Extensión lumbar","Espalda","🎯","Back extension, lumbares en máquina"],["Crunch en polea","Abdomen","🎯","Cable crunch, abdominales polea"]];
const CATALOG_MARK='app-polenta-catalog-v2';
const catalogKey=name=>'catalog-'+String(name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const catalogueName=name=>String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLocaleLowerCase();
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');const fmt=d=>new Date(d).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});const parseWeight=v=>{const raw=String(v??'').trim().replace(',','.');if(!raw)return null;if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw))return NaN;const n=Number(raw);return Number.isFinite(n)&&n>=0&&n<=10000?n:NaN};const displayWeight=v=>v===null||v===undefined?'':String(v).replace('.',',');const num=v=>v===''||v===null?null:Number(v);const kg=v=>v===null||v===undefined?'—':String(v).replace('.',',')+' kg';const state=(()=>{try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.machines)&&Array.isArray(s.history))return s}catch(e){}return {machines:defaults.map(([name,group,emoji,alias])=>({id:uid(),name,group,emoji,alias,photo:'',lastWeight:null})),plans:[],history:[],session:null}})();let tab='hoy',search='',editing=null,groupFilter='Todos';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('No se pudo guardar. Puede haberse agotado el almacenamiento local; exportá una copia y probá con imágenes más pequeñas.')}}function notice(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(notice.t);notice.t=setTimeout(()=>el.style.display='none',2500)}function seedCatalogue(){
  let changed=false;
  for(const [name,group] of defaults.concat(extraCatalog)){
    const matched=state.machines.find(m=>catalogueName(m.name)===catalogueName(name)&&m.group===group);
    if(matched&&!matched.catalogKey){matched.catalogKey=catalogKey(name);changed=true;}
  }
  try{
    if(localStorage.getItem(CATALOG_MARK)!=='1'){
      for(const [name,group,emoji,alias] of extraCatalog){
        if(!state.machines.some(m=>catalogueName(m.name)===catalogueName(name)&&m.group===group)){
          state.machines.push({id:catalogKey(name),catalogKey:catalogKey(name),name,group,emoji,alias,photo:'',lastWeight:null});changed=true;
        }
      }
      if(changed)save();localStorage.setItem(CATALOG_MARK,'1');
    }else if(changed)save();
  }catch(err){if(changed)save();}
}
seedCatalogue();
function mBy(id){return state.machines.find(m=>m.id===id)}function lastFor(id){let found=null;for(let i=state.history.length-1;i>=0;i--){let it=state.history[i].items.find(x=>x.id===id&&x.done);if(it){found=it;break}}return found?.weight??mBy(id)?.lastWeight??null}function lastSpecs(id){const result={sets:null,reps:null,weight:null};const ordered=state.history.slice().sort((a,b)=>new Date(b.ended||b.started).getTime()-new Date(a.ended||a.started).getTime());for(const h of ordered){const it=(h.items||[]).find(x=>x.id===id&&x.done);if(!it)continue;for(const field of ['sets','reps','weight']){if(result[field]===null&&it[field]!==null&&it[field]!==undefined&&Number.isFinite(Number(it[field])))result[field]=Number(it[field]);}if(Object.values(result).every(v=>v!==null))break;}if(result.weight===null)result.weight=mBy(id)?.lastWeight??null;return result;}
function specText(it){const a=Number.isInteger(it.sets)&&it.sets>0?it.sets:'—';const b=Number.isInteger(it.reps)&&it.reps>0?it.reps:'—';return `${a} × ${b} · ${kg(it.weight)}`}
function makeSessionItem(id){const last=lastSpecs(id);return {id,name:mBy(id)?.name||'',sets:last.sets,reps:last.reps,weight:last.weight,done:false}}
function button(t,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${esc(t)}</button>`}function imageEl(m){return m.photo?`<img class="thumb" alt="Foto de ${esc(m.name)}" src="${m.photo}">`:`<div class="thumb" aria-label="Sin foto">${esc(m.emoji||'🏋️')}</div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===tab));document.getElementById('view').innerHTML=({hoy:renderToday,maquinas:renderMachines,planes:renderPlans,historial:renderHistory})[tab]();}
function renderToday(){const s=state.session;let html=`<section class="hero"><div class="eyebrow">TU ENTRENAMIENTO, SIN VUELTAS</div><h1>Un poquito más fuerte<br>cada día.</h1><p>Registrá series, repeticiones y peso de cada máquina. Elegí un plan o entrená libremente.</p>${!s?`<div class="actions">${button('⚡ Empezar libre','start-free','primary')}${button('📋 Elegir un plan','choose-plan','light')}</div>`:`<div class="tag" style="color:#283818">● ENTRENAMIENTO EN CURSO</div>`}</section>`;
if(!s){html+=`<div class="grid2"><div class="metric"><strong>${state.history.length}</strong><span>Entrenamientos guardados</span></div><div class="metric"><strong>${state.machines.length}</strong><span>Máquinas disponibles</span></div></div><div class="sectiontitle"><h2>¿Cómo funciona?</h2></div><div class="panel help">1. Elegí un plan o empezá libre.<br>2. Indicá series × repeticiones y peso (kg) y marcá cada máquina.<br>3. Cerrá la sesión. La próxima vez, APP recordará los valores registrados.</div>`;return html;}
const done=s.items.filter(i=>i.done).length;html+=`<div class="panel"><div class="row"><div><strong>${esc(s.planName||'Entrenamiento libre')}</strong><div class="smalltxt muted">Iniciado ${new Date(s.started).toLocaleString('es-AR',{hour:'2-digit',minute:'2-digit'})}</div></div><span class="tag">${done}/${s.items.length} completadas</span></div><div class="progress"><div style="width:${s.items.length?Math.round(done/s.items.length*100):0}%"></div></div><div class="actions">${button('+ Añadir máquina','add-to-session','small')}${button('Finalizar sesión','finish','small primary')}${button('Descartar','discard','small danger')}</div></div>`;
html+=s.items.length?s.items.map((it,i)=>sessionCard(it,i)).join(''):`<div class="empty">Todavía no agregaste máquinas. Tocá «Añadir máquina» para empezar.</div>`;return html}
function sessionCard(it,i){const m=mBy(it.id)||{name:it.name||'Máquina eliminada',emoji:'🏋️',group:'Otra'};const last=lastSpecs(it.id);return `<article class="panel exercise-card ${it.done?'done':''}">
<div class="exercise-head">${imageEl(m)}<div class="machine-main"><div class="machine-name">${esc(m.name)}</div><div class="machine-meta">${esc(m.alias||m.group)}</div><div class="machine-meta">Última vez: ${specText(last)}</div></div><button type="button" class="check" data-action="toggle" data-index="${i}" aria-label="${it.done?'Desmarcar':'Marcar'} ${esc(m.name)}" title="${it.done?'Desmarcar':'Marcar'}">${it.done?'✓':'○'}</button></div>
<div class="exercise-fields"><label><span class="fieldlabel">Series</span><input aria-label="Series para ${esc(m.name)}" inputmode="numeric" type="number" min="1" max="100" step="1" value="${it.sets??''}" placeholder="Ej. 3" data-exercise data-index="${i}" data-field="sets"></label><label><span class="fieldlabel">Repeticiones</span><input aria-label="Repeticiones para ${esc(m.name)}" inputmode="numeric" type="number" min="1" max="500" step="1" value="${it.reps??''}" placeholder="Ej. 12" data-exercise data-index="${i}" data-field="reps"></label><label><span class="fieldlabel">Peso (kg)</span><span class="decimal-wrap"><input aria-label="Peso en kilos para ${esc(m.name)}" inputmode="decimal" type="text" inputmode="decimal" autocomplete="off" value="${displayWeight(it.weight)}" placeholder="Ej. 40,7" data-exercise data-index="${i}" data-field="weight"><button type="button" class="decimal-key" data-decimal-for="${i}" aria-label="Agregar coma decimal al peso">,</button></span></label></div>
<div class="row" style="margin-top:10px"><span class="exercise-note">${it.done?'✓ Registrada; podés corregir los valores':'Completá los valores y marcala cuando termines'}</span><button class="btn exercise-remove" data-action="remove-session" data-index="${i}" aria-label="Quitar ${esc(m.name)}">Quitar</button></div></article>`}
function renderMachines(){const groups=['Todos',...new Set(state.machines.map(m=>m.group||'Otro'))];const filtered=state.machines.filter(m=>(m.name+' '+m.alias+' '+m.group).toLocaleLowerCase().includes(search.toLocaleLowerCase())&&(groupFilter==='Todos'||m.group===groupFilter));return `<div class="sectiontitle"><h2>Mis máquinas (${state.machines.length})</h2>${button('+ Nueva máquina','new-machine','small primary')}</div><p class="help">Buscá por nombre o alias, filtrá por grupo y subí una foto de las máquinas de tu gimnasio para reconocerlas fácilmente.</p><div class="catalog-search"><input class="field" id="search" placeholder="Buscar máquina o alias…" value="${esc(search)}" aria-label="Buscar máquinas"><select id="groupFilter" aria-label="Filtrar por grupo muscular">${groups.map(g=>`<option value="${esc(g)}" ${groupFilter===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div id="machineResults">${filtered.length?filtered.map(m=>`<div class="machine">${imageEl(m)}<div class="machine-main"><div class="machine-name">${esc(m.name)}</div><div class="machine-meta">${esc(m.group)} ${m.alias?' · '+esc(m.alias):''}</div><div class="tag" style="margin-top:6px">Último registro: ${specText(lastSpecs(m.id))}</div></div><button class="btn small" data-action="edit-machine" data-id="${esc(m.id)}">Editar</button></div>`).join(''):`<div class="empty">No hay máquinas con ese nombre.</div>`}</div>`}
function renderPlans(){return `<div class="sectiontitle"><h2>Mis planes</h2>${button('+ Crear plan','new-plan','small primary')}</div><p class="help">Un plan es opcional. Podés preparar rutinas por día o por grupo muscular y repetirlas cuantas veces quieras.</p>${state.plans.length?state.plans.map(p=>`<div class="panel"><div class="row"><div><strong>${esc(p.name)}</strong><div class="smalltxt muted">${p.ids.length} máquinas</div></div><div class="actions">${button('Usar','start-plan:'+p.id,'small primary')}${button('Editar','edit-plan:'+p.id,'small')}${button('Borrar','delete-plan:'+p.id,'small danger')}</div></div><div>${p.ids.map(id=>mBy(id)).filter(Boolean).map(m=>`<span class="chip">${esc(m.name)}</span>`).join('')}</div></div>`).join(''):`<div class="empty">Todavía no hay planes. Podés crear uno o entrenar libremente.</div>`}`}
function renderHistory(){const done=state.history.reduce((n,s)=>n+s.items.filter(x=>x.done).length,0);return `<div class="sectiontitle"><h2>Historial y progreso</h2>${button('Exportar datos','export-json','small')}</div><div class="grid2"><div class="metric"><strong>${state.history.length}</strong><span>Sesiones finalizadas</span></div><div class="metric"><strong>${done}</strong><span>Máquinas registradas</span></div></div><div class="sectiontitle"><h2>Últimos entrenamientos</h2></div>${state.history.length?state.history.slice().reverse().map(s=>`<div class="panel"><div class="row"><div><strong>${esc(s.planName||'Entrenamiento libre')}</strong><div class="smalltxt muted">${fmt(s.ended||s.started)}</div></div><span class="tag">${s.items.filter(x=>x.done).length} completadas</span></div>${s.items.filter(x=>x.done).map(it=>`<div class="history-entry"><div class="row"><span>${esc(it.name||mBy(it.id)?.name||'Máquina')}</span><strong>${specText(it)}</strong></div></div>`).join('')||'<p class="muted smalltxt">Sin máquinas marcadas.</p>'}</div>`).join(''):`<div class="empty">Tus sesiones aparecerán aquí al finalizarlas.</div>`}<div class="sectiontitle"><h2>Mis datos</h2></div><div class="panel"><p class="help">Los datos se guardan localmente en este navegador. Exportá una copia para no perderlos al borrar datos o cambiar de teléfono. Las fotos se incluyen en el respaldo JSON.</p><div class="actions">${button('Exportar respaldo JSON','export-json','small')}${button('Exportar historial CSV','export-csv','small')}<label class="btn small" style="cursor:pointer">Importar respaldo <input id="importFile" type="file" accept="application/json,.json" style="display:none"></label></div></div>`}
function openDialog(html){document.getElementById('dialogContent').innerHTML=html;document.getElementById('dlg').showModal()}function closeDialog(){document.getElementById('dlg').close()}
function machineDialog(id){let m=mBy(id)||{name:'',alias:'',group:'Piernas',photo:'',emoji:'🏋️',lastWeight:null};editing=id||null;openDialog(`<h3>${id?'Editar':'Nueva'} máquina</h3><form id="machineForm"><div class="formgrid"><div class="full"><label class="fieldlabel">Nombre *</label><input class="field" name="name" value="${esc(m.name)}" required maxlength="90"></div><div><label class="fieldlabel">Grupo</label><select name="group">${['Piernas','Pecho','Espalda','Hombros','Brazos','Abdomen','Cardio','Otro'].map(g=>`<option ${m.group===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label class="fieldlabel">Peso inicial (kg)</label><span class="decimal-wrap"><input type="text" inputmode="decimal" autocomplete="off" name="weight" value="${displayWeight(m.lastWeight)}" placeholder="Ej. 2,5"><button type="button" class="decimal-key" data-decimal-initial aria-label="Agregar coma decimal al peso inicial">,</button></span></div><div class="full"><label class="fieldlabel">Otros nombres / alias</label><input class="field" name="alias" value="${esc(m.alias)}" maxlength="160" placeholder="Ej.: prensa inclinada, leg press"></div><div class="full"><label class="fieldlabel">Foto de tu máquina (opcional)</label><input type="file" name="photo" accept="image/*"><div class="help">Se reduce para ahorrar espacio. ${m.photo?'Ya tiene una foto guardada.':''}</div></div></div><div class="actions"><button class="btn primary" type="submit">Guardar máquina</button><button class="btn" type="button" data-action="close">Cancelar</button>${id?`<button class="btn danger" type="button" data-action="delete-machine" data-id="${esc(id)}">Eliminar</button>`:''}</div></form>`)}
function planDialog(id){let p=state.plans.find(x=>x.id===id)||{name:'',ids:[]};editing=id||null;openDialog(`<h3>${id?'Editar':'Crear'} plan</h3><form id="planForm"><label class="fieldlabel">Nombre del plan *</label><input class="field" name="name" value="${esc(p.name)}" maxlength="90" placeholder="Ej.: Día de piernas" required><p class="fieldlabel" style="margin-top:14px">Elegí las máquinas</p><div style="max-height:43vh;overflow:auto">${state.machines.map(m=>`<label class="row" style="padding:10px 0;border-bottom:1px solid #404940;justify-content:flex-start"><input type="checkbox" name="ids" value="${esc(m.id)}" ${p.ids.includes(m.id)?'checked':''} style="width:20px;height:20px;accent-color:#b6ff76"><span>${esc(m.name)}</span></label>`).join('')}</div><div class="actions"><button class="btn primary" type="submit">Guardar plan</button><button class="btn" type="button" data-action="close">Cancelar</button></div></form>`)}
function choiceDialog(){if(!state.plans.length){notice('No tenés planes aún: podés crear uno.');tab='planes';render();return}openDialog(`<h3>Elegí un plan</h3>${state.plans.map(p=>`<div class="panel row"><div><strong>${esc(p.name)}</strong><div class="smalltxt muted">${p.ids.length} máquinas</div></div>${button('Empezar','start-plan:'+p.id,'small primary')}</div>`).join('')}<div class="actions">${button('Cerrar','close','small')}</div>`)}
function start(ids,planName){if(state.session){notice('Ya hay un entrenamiento en curso.');tab='hoy';render();return}state.session={id:uid(),started:new Date().toISOString(),planName,items:ids.map(id=>makeSessionItem(id))};save();closeDialog();tab='hoy';render()}
function addDialog(){const existing=new Set(state.session.items.map(it=>it.id));const rest=state.machines.filter(m=>!existing.has(m.id));openDialog(`<h3>Añadir una máquina</h3>${rest.length?`<input class="field" id="addSearch" placeholder="Buscar máquina…"><div id="addList" style="max-height:49vh;overflow:auto">${addRows(rest)}</div>`:'<p>No quedan máquinas por añadir.</p>'}<div class="actions">${button('+ Crear una nueva','new-machine','small')}${button('Cerrar','close','small')}</div>`)}function addRows(ms){return ms.map(m=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #3c4839"><span>${esc(m.emoji)} ${esc(m.name)}</span>${button('Añadir','add-machine:'+m.id,'small primary')}</div>`).join('')||'<p class="help">No hay resultados.</p>'}
function exportFile(name,contents,type){const u=URL.createObjectURL(new Blob([contents],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
function exportCsv(){let rows=[['fecha','plan','maquina','series','repeticiones','peso_kg','completada']];state.history.forEach(s=>s.items.forEach(it=>rows.push([s.ended||s.started,s.planName||'Libre',it.name||mBy(it.id)?.name||'',it.sets??'',it.reps??'',it.weight??'',it.done?'si':'no'])));exportFile('APP_historial_'+today()+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function validateImport(x){return x&&Array.isArray(x.machines)&&Array.isArray(x.plans)&&Array.isArray(x.history)&&(x.session===null||typeof x.session==='object')&&x.machines.length<10000&&x.history.length<100000&&x.machines.every(m=>typeof m.id==='string'&&typeof m.name==='string')}function resize(file){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{try{const ratio=Math.min(1,480/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.65))}catch(e){reject(e)}};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error('No se pudo leer la imagen'))};img.src=u})}
function finish(){let s=state.session;if(!s)return;const marked=s.items.filter(it=>it.done);if(!marked.length&&!confirm('No marcaste ninguna máquina. ¿Guardar la sesión vacía?'))return;const incomplete=marked.filter(it=>!Number.isInteger(it.sets)||it.sets<1||!Number.isInteger(it.reps)||it.reps<1||it.weight===null||it.weight===undefined);if(incomplete.length&&!confirm(`${incomplete.length} máquina(s) marcada(s) tienen series, repeticiones o peso sin registrar. ¿Guardar igual?`))return;if(!confirm('¿Finalizar y guardar este entrenamiento?'))return;s.ended=new Date().toISOString();s.items=s.items.map(it=>({...it,name:mBy(it.id)?.name||it.name}));for(const it of marked){const m=mBy(it.id);if(m&&it.weight!==null)m.lastWeight=it.weight}state.history.push(s);state.session=null;save();render();notice('¡Entrenamiento guardado!')}
async function action(act,el){if(act==='start-free')return start([],null);if(act==='choose-plan')return choiceDialog();if(act==='new-machine')return machineDialog();if(act==='edit-machine')return machineDialog(el.dataset.id);if(act==='new-plan')return planDialog();if(act==='close')return closeDialog();if(act==='add-to-session')return addDialog();if(act==='finish')return finish();if(act==='discard'){if(confirm('¿Descartar el entrenamiento actual? No se guardarán sus registros.')){state.session=null;save();render()}return}if(act==='toggle'){const it=state.session?.items[+el.dataset.index];if(it){it.done=!it.done;save();render()}return}if(act==='remove-session'){state.session.items.splice(+el.dataset.index,1);save();render();return}if(act==='export-json')return exportFile('APP_respaldo_'+today()+'.json',JSON.stringify(state,null,2),'application/json');if(act==='export-csv')return exportCsv();if(act==='delete-machine'){if(!confirm('¿Eliminar esta máquina del catálogo? El historial guardado se conservará.'))return;state.machines=state.machines.filter(m=>m.id!==el.dataset.id);state.plans.forEach(p=>p.ids=p.ids.filter(id=>id!==el.dataset.id));save();closeDialog();render();return}if(act.startsWith('start-plan:')){const p=state.plans.find(x=>x.id===act.split(':')[1]);if(p)start(p.ids.filter(id=>mBy(id)),p.name);return}if(act.startsWith('edit-plan:'))return planDialog(act.split(':')[1]);if(act.startsWith('delete-plan:')){const id=act.split(':')[1];if(confirm('¿Eliminar este plan? El historial no se modifica.')){state.plans=state.plans.filter(p=>p.id!==id);save();render()}return}if(act.startsWith('add-machine:')){const id=act.split(':')[1];if(!state.session.items.some(i=>i.id===id)){state.session.items.push(makeSessionItem(id));save();closeDialog();render()}return}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){tab=nav.dataset.nav;search='';render();return}const el=e.target.closest('[data-action]');if(el)action(el.dataset.action,el)});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='addSearch'){const q=e.target.value.toLocaleLowerCase(),ids=new Set(state.session.items.map(i=>i.id));document.getElementById('addList').innerHTML=addRows(state.machines.filter(m=>!ids.has(m.id)&&(m.name+' '+m.alias+' '+m.group).toLocaleLowerCase().includes(q)))}if(e.target.matches('[data-exercise]')){const it=state.session?.items[+e.target.dataset.index],field=e.target.dataset.field;if(it&&['sets','reps','weight'].includes(field)){const raw=e.target.value,number=field==='weight'?parseWeight(raw):(raw===''?null:Number(raw));const valid=number===null||(Number.isFinite(number)&&number>=(field==='weight'?0:1)&&number<=(field==='weight'?10000:field==='sets'?100:500)&&(field==='weight'||Number.isInteger(number)));if(valid){it[field]=number;save()}}}});
document.addEventListener('click',e=>{const button=e.target.closest('[data-decimal-for],[data-decimal-initial]');if(!button)return;const input=button.hasAttribute('data-decimal-initial')?document.querySelector('#machineForm input[name="weight"]'):document.querySelector('[data-exercise][data-field="weight"][data-index="'+button.dataset.decimalFor+'"]');if(!input)return;const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;if(input.value.includes(',')||input.value.includes('.')){input.focus();return;}input.focus();input.setRangeText(',',start,end,'end');input.dispatchEvent(new Event('input',{bubbles:true}));});
document.addEventListener('submit',async e=>{if(e.target.id==='machineForm'){e.preventDefault();const f=e.target,fd=new FormData(f),name=String(fd.get('name')||'').trim();if(!name)return;let old=mBy(editing);let photo=old?.photo||'';let file=f.elements.photo.files[0];if(file){if(!file.type.startsWith('image/'))return alert('Elegí una imagen.');try{photo=await resize(file)}catch(ex){return alert(ex.message)}}const weight=parseWeight(fd.get('weight'));if(Number.isNaN(weight))return alert('El peso debe ser un número válido: por ejemplo, 2,5 o 40,7 kg.');let obj={id:editing||uid(),name,alias:String(fd.get('alias')||'').trim(),group:String(fd.get('group')),emoji:old?.emoji||'🏋️',photo,lastWeight:weight};if(old)Object.assign(old,obj);else state.machines.push(obj);save();closeDialog();render();notice('Máquina guardada');return}if(e.target.id==='planForm'){e.preventDefault();const fd=new FormData(e.target),ids=fd.getAll('ids').map(String),name=String(fd.get('name')||'').trim();if(!name)return;let p=state.plans.find(p=>p.id===editing);if(p)Object.assign(p,{name,ids});else state.plans.push({id:uid(),name,ids});save();closeDialog();render();notice('Plan guardado')}});
document.addEventListener('change',async e=>{if(e.target.id==='groupFilter'){groupFilter=e.target.value;render();return}if(e.target.id==='importFile'){const file=e.target.files[0];if(!file)return;try{if(file.size>25_000_000)throw Error('Archivo demasiado grande');const obj=JSON.parse(await file.text());if(!validateImport(obj))throw Error('Formato de respaldo no válido');if(!confirm('Importar reemplazará todos tus datos actuales. ¿Continuar?'))return;for(const k of ['machines','plans','history','session'])state[k]=obj[k];save();render();notice('Respaldo importado')}catch(err){alert('No se pudo importar: '+err.message)}}});render();

let deferredInstallPrompt=null;
function standalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function updateInstallUI(){const el=document.getElementById('installHelp');if(standalone()){el.hidden=true;return}const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);if(deferredInstallPrompt){el.hidden=false;el.innerHTML='<strong>Instalá APP en tu teléfono.</strong> Funciona como aplicación y puede abrirse sin conexión. <button class="btn small primary" id="installApp" type="button">Instalar APP</button>';return}if(ios){el.hidden=false;el.innerHTML='<strong>Instalá APP en iPhone:</strong> abrí esta página en Safari, tocá Compartir y elegí «Agregar a pantalla de inicio». Si aparece, seleccioná «Abrir como app».';return}el.hidden=false;el.innerHTML='<strong>Instalación:</strong> desde el menú del navegador elegí «Instalar app» o «Agregar a pantalla de inicio». Para instalarla necesitás abrir APP desde una dirección HTTPS.'}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallUI()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallUI();notice('APP instalada')});
document.addEventListener('click',async e=>{if(e.target.id==='installApp'&&deferredInstallPrompt){const prompt=deferredInstallPrompt;deferredInstallPrompt=null;await prompt.prompt();updateInstallUI()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('No se pudo habilitar el modo sin conexión:',err)))}
updateInstallUI();

window.PolentaLocal={
  getSnapshot:()=>({machines:structuredClone(state.machines),plans:structuredClone(state.plans),history:structuredClone(state.history)}),
  mergeSnapshot:(remote,idMap={})=>{
    const mapId=id=>idMap[id]||id;
    for(const m of state.machines)m.id=mapId(m.id);
    const found=new Map();
    for(const m of state.machines){const old=found.get(m.id);if(!old)found.set(m.id,m);else if(m.photo&&!old.photo)old.photo=m.photo;}
    state.machines=[...found.values()];
    for(const p of state.plans)p.ids=[...new Set((p.ids||[]).map(mapId))];
    for(const h of state.history)for(const it of (h.items||[]))it.id=mapId(it.id);
    if(state.session)for(const it of (state.session.items||[]))it.id=mapId(it.id);
    for(const kind of ['machines','plans','history']){
      const byId=new Map(state[kind].map(x=>[x.id,x]));
      for(const row of remote[kind]||[]){
        if(!byId.has(row.id)){state[kind].push(row);byId.set(row.id,row);}
        else if(kind==='machines'){
          const current=byId.get(row.id),photo=current.photo||row.photo||'';
          Object.assign(current,row,{photo});
        }
      }
    }
    save();render();
  },
  exportBackup:()=>exportFile('APP_respaldo_antes_de_sincronizar_'+today()+'.json',JSON.stringify(state,null,2),'application/json'),
  message:notice
};
document.getElementById('accountButton').addEventListener('click',()=>{
  const handler=window.PolentaCloud;
  if(!handler){alert('La conexión a Firebase no está configurada todavía. APP sigue funcionando sin cuenta.');return}
  handler.openAccount();
});
window.addEventListener('polenta-cloud-state',(e)=>{
  const d=e.detail||{};
  document.getElementById('cloudStatus').textContent=d.message||'Modo sin cuenta';
});
